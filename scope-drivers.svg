<svg viewBox="0 0 1000 268" role="img" aria-labelledby="sdT sdD" xmlns="http://www.w3.org/2000/svg">
  <title id="sdT">What moves the price of an engagement</title>
  <desc id="sdD">Three factors set the fee: the number of automated employment decision tools in scope, the condition of your historical data, and how many demographic categories produce group sizes large enough to analyse.</desc>
  <text x="24" y="30" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" letter-spacing="1.5" fill="var(--slate-lt)">THREE FACTORS SET THE FEE</text>
  <text x="306" y="80" text-anchor="end" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="var(--ink)">AEDTs in scope</text><line x1="330" y1="74" x2="950" y2="74" stroke="var(--rule)" stroke-width="7" stroke-linecap="round"/><line x1="330" y1="74" x2="466.4" y2="74" stroke="var(--pine)" stroke-width="7" stroke-linecap="round"/><circle cx="466.4" cy="74" r="7.5" fill="var(--paper)" stroke="var(--pine)" stroke-width="2.8"/><text x="330" y="99" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">ONE TOOL</text><text x="950" y="99" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">A STACK OF THEM</text>
  <text x="306" y="142" text-anchor="end" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="var(--ink)">Condition of your data</text><line x1="330" y1="136" x2="950" y2="136" stroke="var(--rule)" stroke-width="7" stroke-linecap="round"/><line x1="330" y1="136" x2="671.0" y2="136" stroke="var(--pine)" stroke-width="7" stroke-linecap="round"/><circle cx="671.0" cy="136" r="7.5" fill="var(--paper)" stroke="var(--pine)" stroke-width="2.8"/><text x="330" y="161" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">CLEAN AND COMPLETE</text><text x="950" y="161" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">RECONSTRUCTED</text>
  <text x="306" y="204" text-anchor="end" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="var(--ink)">Analysable group sizes</text><line x1="330" y1="198" x2="950" y2="198" stroke="var(--rule)" stroke-width="7" stroke-linecap="round"/><line x1="330" y1="198" x2="565.6" y2="198" stroke="var(--pine)" stroke-width="7" stroke-linecap="round"/><circle cx="565.6" cy="198" r="7.5" fill="var(--paper)" stroke="var(--pine)" stroke-width="2.8"/><text x="330" y="223" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">MOST CATEGORIES HOLD</text><text x="950" y="223" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">THIN THROUGHOUT</text>
  <text x="24" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate)">HOURS ARE NOT ONE OF THEM.</text>
</svg>