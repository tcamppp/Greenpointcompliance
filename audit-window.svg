<svg viewBox="0 0 1000 210" role="img" aria-labelledby="winT winD" xmlns="http://www.w3.org/2000/svg">
  <title id="winT">The twelve-month audit validity window</title>
  <desc id="winD">A bias audit is valid for twelve months from the date it is conducted. Every use of the tool must fall inside that window, which makes the audit an annual obligation rather than a one-time clearance.</desc>
  <defs>
    <pattern id="lapsed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--flag)" stroke-width="1.8" opacity="0.45"/>
    </pattern>
  </defs>

  <text x="96" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" letter-spacing="1.5" fill="var(--pass)">TOOL MAY BE USED</text>
  <text x="756" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" letter-spacing="1.5" fill="var(--flag)">MAY NOT</text>

  <rect x="96" y="96" width="644" height="30" fill="var(--pass-tint)" stroke="var(--pass)" stroke-width="1.2"/>
  <rect x="740" y="96" width="244" height="30" fill="url(#lapsed)" stroke="var(--flag)" stroke-width="1.2"/>

  <line x1="96" y1="68" x2="96" y2="126" stroke="var(--ink)" stroke-width="1.5"/>
  <circle cx="96" cy="68" r="4.5" fill="var(--ink)"/>
  <text x="92" y="58" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--ink)">Audit conducted</text>

  <line x1="740" y1="68" x2="740" y2="126" stroke="var(--flag)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="740" cy="68" r="4.5" fill="var(--flag)"/>
  <text x="740" y="58" text-anchor="middle" font-family="Libre Franklin, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--flag)">Audit lapses</text>

  <line x1="96.0" y1="126" x2="96.0" y2="132" stroke="var(--slate-lt)" stroke-width="1"/>
  <text x="96.0" y="147" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">0 MO</text>
  <line x1="257.0" y1="126" x2="257.0" y2="132" stroke="var(--slate-lt)" stroke-width="1"/>
  <text x="257.0" y="147" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">3 MO</text>
  <line x1="418.0" y1="126" x2="418.0" y2="132" stroke="var(--slate-lt)" stroke-width="1"/>
  <text x="418.0" y="147" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">6 MO</text>
  <line x1="579.0" y1="126" x2="579.0" y2="132" stroke="var(--slate-lt)" stroke-width="1"/>
  <text x="579.0" y="147" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">9 MO</text>
  <line x1="740.0" y1="126" x2="740.0" y2="132" stroke="var(--slate-lt)" stroke-width="1"/>
  <text x="740.0" y="147" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="var(--slate-lt)">12 MO</text>
  <text x="96" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate)">EVERY USE OF THE TOOL MUST FALL INSIDE THE SHADED WINDOW.</text>
</svg>