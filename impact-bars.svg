<svg viewBox="0 0 1000 260" role="img" aria-labelledby="irT irD" xmlns="http://www.w3.org/2000/svg">
  <title id="irT">Impact ratios against the four-fifths guideline</title>
  <desc id="irD">Group A sets the reference rate at 1.00. Group C returns 0.67 and Group B returns 0.60. Both fall below the 0.80 four-fifths guideline.</desc>

  <text x="150" y="28" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" letter-spacing="1.5" fill="var(--slate-lt)">IMPACT RATIO AGAINST THE HIGHEST-SELECTED GROUP</text>
  <line x1="726.0" y1="42" x2="726.0" y2="202" stroke="var(--flag)" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="736.0" y="198" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" font-weight="600" fill="var(--flag)">0.80</text>
  <text x="736.0" y="214" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="var(--flag)">FOUR-FIFTHS</text>
  <line x1="150" y1="190" x2="870" y2="190" stroke="var(--rule)" stroke-width="1"/>
  <text x="136" y="77" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="var(--ink)">Group A</text><rect x="150" y="58" width="720.0" height="28" fill="var(--pine)"/><text x="859.0" y="77" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#fff">1.00</text><text x="882.0" y="77" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate-lt)">rate 30.0%</text>
  <text x="136" y="129" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="var(--ink)">Group B</text><rect x="150" y="110" width="432.0" height="28" fill="var(--flag)"/><text x="571.0" y="129" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#fff">0.60</text><text x="594.0" y="129" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate-lt)">rate 18.0%</text>
  <text x="136" y="181" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="var(--ink)">Group C</text><rect x="150" y="162" width="482.4" height="28" fill="var(--flag)"/><text x="621.4" y="181" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#fff">0.67</text><text x="644.4" y="181" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate-lt)">rate 20.0%</text>
  <text x="150" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="var(--slate)">TWO OF THREE GROUPS FALL BELOW THE GUIDELINE. BOTH FIGURES STILL GET PUBLISHED.</text>
</svg>